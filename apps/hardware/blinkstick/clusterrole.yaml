apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blinkstick-controller-viewer
  labels:
    app: blinkstick-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
