apiVersion: v1
kind: ConfigMap
metadata:
  name: blinkstick-dashboard
  namespace: blinkstick
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Hardware"
data:
  blinkstick-controller.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Nodes Online",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "blinkstick_nodes_online", "legendFormat": "" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "green", "value": 4 }
                ]
              },
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Nodes with Device",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "blinkstick_nodes_present", "legendFormat": "" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "green", "value": 4 }
                ]
              },
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "WebSocket Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "blinkstick_websocket_connections", "legendFormat": "" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "yellow", "value": 8 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Songs Loaded",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "blinkstick_songs_total", "legendFormat": "" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "super-light-blue", "value": null }
                ]
              },
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Controller Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "up{job=\"blinkstick-controller\"}", "legendFormat": "" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Engine Tick Latency (p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "histogram_quantile(0.99, rate(blinkstick_engine_tick_duration_seconds_bucket[5m]))", "legendFormat": "p99" },
            { "expr": "histogram_quantile(0.50, rate(blinkstick_engine_tick_duration_seconds_bucket[5m]))", "legendFormat": "p50" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.5 }
                ]
              }
            }
          }
        },
        {
          "title": "Mode Switches",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "rate(blinkstick_mode_switches_total[5m])", "legendFormat": "{{ from_mode }} → {{ to_mode }}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "drawStyle": "bars",
                "stacking": { "mode": "normal" }
              }
            }
          }
        },
        {
          "title": "Overlay Triggers",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "rate(blinkstick_overlay_triggers_total[5m])", "legendFormat": "{{ name }}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20,
                "drawStyle": "bars",
                "stacking": { "mode": "normal" }
              }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "twingate-flash" }, "properties": [{ "id": "color", "value": { "fixedColor": "cyan", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "deploy-wave" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "alert-escalation" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }
            ]
          }
        },
        {
          "title": "MQTT Messages",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "rate(blinkstick_mqtt_messages_total[5m])", "legendFormat": "{{ direction }}/{{ topic_prefix }}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Clock Skew per Node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "blinkstick_clock_skew_ms", "legendFormat": "{{ node }}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "thresholdsStyle": { "mode": "line+area" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 200 }
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["blinkstick", "hardware"],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "selected": true, "text": "Prometheus", "value": "prometheus" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "BlinkStick Controller",
      "uid": "blinkstick-controller",
      "version": 1
    }
