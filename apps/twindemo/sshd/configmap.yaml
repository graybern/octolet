apiVersion: v1
kind: ConfigMap
metadata:
  name: sshd-config
  namespace: default
data:
  sshd_config: |
    Port 2222
    PermitRootLogin no
    PasswordAuthentication yes
    PubkeyAuthentication yes
    TrustedUserCAKeys /etc/ssh/twingate_ca.pub
    HostKey /etc/ssh/ssh_host_ed25519_key
    HostKey /etc/ssh/ssh_host_rsa_key
    HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
  setup.sh: |
    #!/bin/sh
    set -e
    apk add --no-cache openssh bash shadow
    mkdir -p /run/sshd /var/empty
    addgroup -S sshd 2>/dev/null || true
    adduser -S -G sshd -H -h /var/empty -s /sbin/nologin sshd 2>/dev/null || true
    ssh-keygen -y -f /etc/ssh/ca_key > /etc/ssh/twingate_ca.pub
    cp /scripts/sshd_config /etc/ssh/sshd_config_custom
    adduser -D -s /bin/bash ubuntu 2>/dev/null || true
    echo "ubuntu:octolet" | chpasswd
    passwd -u ubuntu
    ssh-keygen -A
    ssh-keygen -s /etc/ssh/ca_key -I sshd-host -h /etc/ssh/ssh_host_ed25519_key.pub 2>/dev/null || true
    ssh-keygen -s /etc/ssh/ca_key -I sshd-host -h /etc/ssh/ssh_host_rsa_key.pub 2>/dev/null || true
    exec /usr/sbin/sshd -D -e -f /etc/ssh/sshd_config_custom
