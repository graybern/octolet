apiVersion: v1
kind: Service
metadata:
  name: prometheus-tg
  namespace: monitoring
  annotations:
    resource.twingate.com: "true"
    resource.twingate.com/name: "Infra · Prometheus"
    resource.twingate.com/alias: "prometheus.octolet.int"
spec:
  type: ExternalName
  externalName: prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local
  ports:
    - port: 80
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-tg
  namespace: monitoring
  annotations:
    resource.twingate.com: "true"
    resource.twingate.com/name: "Infra · AlertManager"
    resource.twingate.com/alias: "alertmanager.octolet.int"
spec:
  type: ExternalName
  externalName: prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local
  ports:
    - port: 80
      targetPort: 9093
      protocol: TCP
---
apiVersion: twingate.com/v1beta
kind: TwingateResourceAccess
metadata:
  name: prometheus-access
  namespace: monitoring
spec:
  resourceRef:
    name: prometheus-tg-resource
    namespace: monitoring
  principalExternalRef:
    type: group
    name: Admins
---
apiVersion: twingate.com/v1beta
kind: TwingateResourceAccess
metadata:
  name: alertmanager-access
  namespace: monitoring
spec:
  resourceRef:
    name: alertmanager-tg-resource
    namespace: monitoring
  principalExternalRef:
    type: group
    name: Admins
