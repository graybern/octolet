apiVersion: v1
kind: Service
metadata:
  name: prometheus-tg
  namespace: monitoring
  annotations:
    resource.twingate.com: "true"
    resource.twingate.com/name: "Infra · Prometheus"
    resource.twingate.com/alias: "prometheus.octolet.int"
spec:
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus-stack-kube-prom-prometheus
  ports:
    - port: 80
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-tg
  namespace: monitoring
  annotations:
    resource.twingate.com: "true"
    resource.twingate.com/name: "Infra · AlertManager"
    resource.twingate.com/alias: "alertmanager.octolet.int"
spec:
  selector:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: prometheus-stack-kube-prom-alertmanager
  ports:
    - port: 80
      targetPort: 9093
      protocol: TCP
---
apiVersion: v1
