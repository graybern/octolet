apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twingate-operator
  namespace: argocd
spec:
  project: octolet
  sources:
    - repoURL: ghcr.io/twingate/helmcharts
      chart: twingate-operator
      targetRevision: "0.1.13"
      helm:
        releaseName: twop
        valueFiles:
          - $values/apps/networking/twingate/values.yaml
    - repoURL: https://github.com/graybern/octolet
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: twingate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
