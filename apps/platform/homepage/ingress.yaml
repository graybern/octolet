apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: admin
spec:
  ingressClassName: traefik
  rules:
    - host: homepage.octolet.int
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
