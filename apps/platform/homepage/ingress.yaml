apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: admin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "homepage.svg"
    gethomepage.dev/description: "Service dashboard"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - homepage.octolet.int
  rules:
    - host: homepage.octolet.int
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
