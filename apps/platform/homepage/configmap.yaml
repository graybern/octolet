apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: admin
  labels:
    app: homepage
data:
  settings.yaml: |
    title: Octolet Dashboard
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    useEqualHeights: true
    disableCollapse: false
    showStats: true
    target: _blank
    layout:
      Observability:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
      Twingate Demo:
        style: row
        columns: 4
      Cluster:
        style: row
        columns: 2

  kubernetes.yaml: |
    mode: cluster

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "octolet"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - greeting:
        text_size: xl
        text: "Octolet Pi Cluster"
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short

  services.yaml: |
    - Infrastructure:
        - ArgoCD:
            icon: argocd.svg
            href: http://argocd.octolet.int
            description: GitOps delivery (anonymous read-only)
            siteMonitor: http://argocd-server.argocd:80
        - Prometheus:
            icon: prometheus.svg
            href: http://prometheus.octolet.int
            description: Metrics & alerting
            siteMonitor: http://prometheus-stack-kube-prom-prometheus.monitoring:9090
        - AlertManager:
            icon: alertmanager.svg
            href: http://alertmanager.octolet.int
            description: Alert routing
            siteMonitor: http://alertmanager-operated.monitoring:9093

    - Twingate Demo:
        - httpbin (JWT):
            icon: mdi-api
            href: http://app.int
            description: WebApp with JWT header injection
        - Grafana Basic:
            icon: grafana.svg
            href: http://grafana-basic.octolet.int
            description: Grafana via L4 tunnel (password auth)

  docker.yaml: ""

  bookmarks.yaml: |
    - Links:
        - GitHub Repo:
            - icon: github.svg
              href: https://github.com/graybern/octolet
        - Twingate Admin:
            - icon: twingate.svg
              href: https://gbernard.twingate.com
        - ArgoCD:
            - icon: argocd.svg
              href: http://argocd.octolet.int
        - Architecture Diagram:
            - icon: mdi-sitemap
              href: https://github.com/graybern/octolet/blob/main/docs/architecture.md
