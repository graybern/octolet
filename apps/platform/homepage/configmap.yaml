apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: admin
  labels:
    app: homepage
data:
  settings.yaml: |
    title: Octolet Dashboard
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    useEqualHeights: true
    disableCollapse: false
    showStats: true
    target: _blank
    layout:
      Observability:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 4
      Twingate Demo:
        style: row
        columns: 4
      Cluster:
        style: row
        columns: 2

  kubernetes.yaml: |
    mode: cluster

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "octolet"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - greeting:
        text_size: xl
        text: "Octolet Pi Cluster"
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short

  services.yaml: |
    - Observability:
        - Grafana:
            icon: grafana.svg
            href: https://grafana.octolet.int
            description: Dashboards (JWT auto-login via Twingate)
            siteMonitor: http://grafana.monitoring:80
        - Prometheus:
            icon: prometheus.svg
            href: https://prometheus.octolet.int
            description: Metrics & alerting
            siteMonitor: http://prometheus-stack-kube-prom-prometheus.monitoring:9090
        - AlertManager:
            icon: alertmanager.svg
            href: https://alertmanager.octolet.int
            description: Alert routing
            siteMonitor: http://alertmanager-operated.monitoring:9093

    - Infrastructure:
        - ArgoCD:
            icon: argocd.svg
            href: https://argocd.octolet.int
            description: GitOps delivery (anonymous read-only)
            siteMonitor: http://argocd-server.argocd:80
        - Headlamp:
            icon: kubernetes.svg
            href: https://headlamp.octolet.int
            description: K8s dashboard (HA, 3 replicas)
            siteMonitor: http://headlamp.kube-system:80
        - Twingate Gateway:
            icon: twingate.svg
            description: L7 proxy · K8s API · SSH · JWT
            siteMonitor: http://twop-gateway.twingate:9090/metrics
        - Twingate Connectors:
            icon: twingate.svg
            description: 2x connectors (prem-tejon-octolet)

    - Twingate Demo:
        - httpbin (JWT):
            icon: mdi-api
            href: https://app.int
            description: WebApp with JWT header injection
        - SSH Server:
            icon: mdi-console
            description: SSH cert auth · ssh.octolet.int
        - Grafana Basic:
            icon: grafana.svg
            href: https://grafana-basic.octolet.int
            description: Grafana via L4 tunnel (password auth)
        - sshd Pod:
            icon: mdi-server
            description: ubuntu:24.04 · Twingate CA trust
            siteMonitor: http://sshd.default:22

  docker.yaml: ""

  bookmarks.yaml: |
    - Links:
        - GitHub Repo:
            - icon: github.svg
              href: https://github.com/graybern/octolet
        - Twingate Admin:
            - icon: twingate.svg
              href: https://gbernard.twingate.com
        - ArgoCD:
            - icon: argocd.svg
              href: https://argocd.octolet.int
        - Architecture Diagram:
            - icon: mdi-sitemap
              href: https://github.com/graybern/octolet/blob/main/docs/architecture.md
